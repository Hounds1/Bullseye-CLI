plugins {
    id 'application'
}

group = 'io.bullseye'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.87'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'io.bullseye.cli.BullseyeCli'
    applicationName = 'bullseye'
}

distributions {
    main {
        distributionBaseName = 'bullseye-cli'
    }
}

def releaseVersion = version.toString()
tasks.named('processResources') {
    inputs.property('releaseVersion', releaseVersion)
    filesMatching('io/bullseye/cli/version.txt') {
        expand(releaseVersion: releaseVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}
